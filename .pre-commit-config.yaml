# PyRogue Pre-commit Configuration
# リファクタリング・新機能追加時の自動品質チェック

repos:
  # 基本的なコード品質チェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff - use the version pinned by uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked --extra dev ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked --extra dev ruff format --check
        language: system
        types: [python]

  # MyPy - check only the canonical state API; legacy modules are outside this gate.
  - repo: local
    hooks:
      - id: mypy
        name: Mypy canonical state
        entry: uv run --locked --extra dev mypy src/pyrogue/core/rogue_game.py src/pyrogue/core/game_state.py
        language: system
        pass_filenames: false
        files: ^src/pyrogue/core/(rogue_game|game_state)\.py$

  # カスタムフック - CLI動作確認テスト
  - repo: local
    hooks:
      - id: cli-test
        name: CLI動作確認テスト
        entry: scripts/cli_test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true

  # pytest実行
  - repo: local
    hooks:
      - id: pytest
        name: Pytestテスト実行
        entry: uv run --locked --extra dev pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true

  # 高信頼な形式の秘密情報検査。網羅的なスキャナの代替ではない。
  - repo: local
    hooks:
      - id: secret-pattern-scan
        name: Secret pattern scan
        entry: scripts/check_secrets.sh
        language: system
        pass_filenames: true
        stages: [pre-commit, manual]
